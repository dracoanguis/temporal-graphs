related_formalizations:
  - id: "https://github.com/dracoanguis/temporal-graphs (branch nlogn-spanner-dismountability-submission, commit 79214ea8379246e8705cfeee95fb9dca090112e9)"
    relationship: "builds-on"
    note: >-
      The O(n log n) entry of the same repository (Casteigts–Peters–Schoeters 2019 via SAND 2025).
      The statement of record uses verbatim the same definitions (IsLocallyInjective, Journey,
      IsTemporalSpanner, namespace TemporalCliqueSpanners), and the Solution reuses its bridge to
      the library unchanged. Both proofs share the dismountability reduction and a generic
      induction on cliques (exists_isSpannerOf_ncard_le_of_forall_not_twoHopDismountable); only
      the non-dismountable case differs: one-sided dismountability for O(n log n), extremally
      matched bi-cliques and stars for 7n.

