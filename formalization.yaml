  scope: >-
    Compared: exists_isTemporalSpanner_card_le_seven_mul (explicit bound 7n) and
    exists_isBigO_isTemporalSpanner_linear (O(n), one bound function for all cliques). The library
    (TemporalGraph/) also proves the intermediate results of Baligács 2026 (Lemmas 5, 13, 14, 16,
    17, Observation 9, Corollary 15, Theorems 3, 18 and 20) and of SAND 2025, which are not
    compared.
  sorry_count: 0
  sorry_in_definitions: 0
