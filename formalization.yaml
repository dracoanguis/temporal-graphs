      The explicit solution of the spanner-size recurrence follows the merge-sort analysis of
      CSLib (recurrence on the halves, halving lemma for Nat.clog 2, closed form n⌈log₂ n⌉).
      No previous formalization of temporal spanners is known to the author; no systematic
      search was made.

