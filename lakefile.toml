name = "temporal-graph"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["TemporalGraph", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
weak.linter.style.emptyline=false

[[require]]
name = "mathlib"
scope = "leanprover-community"

# Used by `leanblueprint checkdecls` to check that the declarations named in
# the blueprint exist.
[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[lean_lib]]
name = "TemporalGraph"
globs = ["TemporalGraph.*"]

# Palomar submission: the statement of record (Mathlib-only imports) and its proof.
[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
