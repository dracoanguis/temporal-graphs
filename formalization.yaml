fidelity:
  divergences: >-
    Labels are natural numbers (any linearly ordered labels on a finite clique can be replaced by
    their ranks). Each edge has exactly one label (simple temporal graph) and the labelling is
    locally injective, as in the sources. The labelling is a function on Sym2 V; its values on
    the diagonal are ignored. Journeys are strict (strictly increasing labels); a spanner is a
    Finset of non-diagonal edges. Vertex types live in Type (universe 0). The explicit bound uses
    Nat.clog 2, the asymptotic form Real.log.

