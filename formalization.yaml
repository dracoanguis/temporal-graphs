automation:
  methods:
    - method: "manual"
      prompting_notes: >-
        First part, written by Ethan Bargaud-Arm without any AI assistance as part of his master's
        thesis work (September 2025 to July 2026, every commit up to 2f3b153): the model of
        temporal graphs, temporal walks, sub-temporal graphs and connectivity, and SAND 2025 §§2–3, namely Theorem 2.1 (1-hop and 2-hop
        dismountability), Lemmas 3.1, 3.2 and 3.4 and Corollary 3.3, without any sorry.
    - method: "agent"
      models: ["Claude Opus 5.5", "Claude Sonnet 5.5"]
      framework: "Claude Code"
      tool_setup: "lean-lsp MCP server and the lean4-skills plugin; local lake builds"
      prompting_notes: >-
        Second part, from September 2026: Ethan Bargaud-Arm resumed the work with Claude, which
        assisted in a refactoring guided by him and in the O(n log n) entry (see
        related_formalizations). For the 7n result (October 2026), two independent agent-driven
        formalizations of Baligács 2026 were first produced on separate branches, without sorry.
        They were then merged into the library under his direction (October–November 2026): the
        paper's notions were rewritten on the existing API (time of an arc as an Option, time-window
        reachability, the earliest/latest neighbor functions and the dismountability results of
        SAND 2025, the generic clique induction), keeping the mathematical approach of one branch
        and the library integration of the other, followed by a readability pass and the Palomar
        Challenge and Solution.
  notes: >-
    Every statement, definition and design decision was made or approved by the author; AI
    contributions were reviewed through the Lean kernel (all proofs are machine-checked) and
    agent-run audits of the statements against the sources.

fidelity:
  divergences: >-
    Labels are natural numbers (any linearly ordered labels on a finite clique can be replaced by
    their ranks). Each edge has exactly one label (simple temporal graph) and the labelling is
    locally injective, as in the source; the reductions of Baligács 2026, §2.1 to this case are
    not formalized but absorbed into the statement. The labelling is a function on Sym2 V; its
    values on the diagonal are ignored. Journeys are non-strict (non-decreasing labels), like the
    walks of the library; on these simple, locally injective cliques this gives the same
    reachability as strict journeys, since two consecutive distinct edges have distinct labels. A
    spanner is a Finset of non-diagonal edges. Vertex types live in Type (universe 0). The
    asymptotic form states O(n) with a bound function chosen uniformly for all cliques.

review:
  status: "self-assessed"
  notes: >-
    The statements and the formalization were reviewed and approved by the author. Automated
    checks made before submission: lake comparator --paranoid accepts the Solution (Lean's
    kernel and the bundled lean4lean, nanoda, con-leche and con-ron checkers), and the definitions
    of the statement are byte-identical to those of the registered O(n log n) entry.

