version: "v0.4"

project:
  name: "Temporal cliques admit spanners of size O(n log n)"
  description: >-
    Lean 4 / Mathlib formalization of the theorem that every temporal clique on n vertices admits
    a temporal spanner with O(n log n) edges. A temporal clique is the complete graph on a finite
    vertex set whose edges carry natural-number time labels, locally injective (two edges sharing
    an endpoint have distinct labels); a temporal spanner is a set of edges in which every vertex
    reaches every other one by a journey with strictly increasing labels. The result is due to
    Casteigts, Peters and Schoeters (ICALP 2019, JCSS 2021); the formal proof follows the
    dismountability-only proof of Carnevale, Casteigts and Corsini (SAND 2025, §§2–4), which
    reduces cliques to bi-cliques and concludes with the one-sided dismountability of Angrick et
    al. (ESA 2024). The compared statements give an explicit bound of 2n⌈log₂ n⌉ + 4n edges and
    the asymptotic O(n log n) form with a bound function chosen uniformly for all cliques. The
    work is supervised by Arnaud Casteigts and Karine Altisen.
  authors:
    - "Ethan Bargaud-Arm"
  responsible_maintainers:
    - "Ethan Bargaud-Arm"
  license: "Apache-2.0"

