# Python environment for building the blueprint with leanblueprint (plasTeX), managed by uv.
# `uv run leanblueprint web` creates `.venv/` and installs the locked dependencies on first use;
# TeX for the PDF comes from `uv run install-tinytex` (into .venv/tinytex).
# See the Blueprint section of the README.
[project]
name = "temporal-graphs-blueprint"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "leanblueprint==0.0.20",
]

# plasTeX needs `kpsewhich` to resolve `\input{macros/...}`, and the PDF needs xelatex and
# latexmk; all of them ship with the environment instead of a global TeX install
# (see blueprint_tools/). `install-tinytex` downloads TeX into .venv/tinytex once.
[project.scripts]
kpsewhich = "blueprint_tools.kpsewhich:main"
install-tinytex = "blueprint_tools.tinytex:install"
latexmk = "blueprint_tools.tinytex:latexmk"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "blueprint_tools"
module-root = ""
