name: Lean Action CI

# Builds the library, the Verso blueprint and the doc-gen4 API documentation, and deploys the
# last two to GitHub Pages from `main`. The documentation and the blueprint are built from the
# committed sub-projects `docbuild/` and `blueprint/` (no docgen-action: it rewrites
# `docbuild/lakefile.toml` and only knows leanblueprint).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Library: `lake build` with the Mathlib cache (no Mathlib compilation).
      - uses: leanprover/lean-action@v1

      # Blueprint: checks every `(lean := "…")` name against the library (strictResolve) and
      # renders the HTML. Nobody publishes prebuilt Verso or doc-gen4 outputs (Reservoir has none,
      # checked 2026-11-06), so both are built here and cached. On a key miss the latest cache is
      # still restored (`restore-keys`): Lake's traces then rebuild only what changed, e.g. a
      # Mathlib bump leaves Verso untouched.
      - name: Restore blueprint dependencies
        uses: actions/cache@v6
        with:
          path: |
            blueprint/.lake
            blueprint/vendor
            .lake/packages/verso
            .lake/packages/subverso
            .lake/packages/verso-slides
            .lake/packages/lean_vir
            .lake/packages/illuminate
            .lake/packages/MD4Lean
          key: blueprint-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'blueprint/lake-manifest.json', 'blueprint/patches/*.patch') }}
          restore-keys: blueprint-

      - name: Build the blueprint
        working-directory: blueprint
        run: |
          ./scripts/setup-verso-blueprint.sh
          ~/.elan/bin/lake build
          ~/.elan/bin/lake exe vbp build

      # API documentation. doc-gen4 always documents every imported module, Mathlib included (no
      # option to link to the hosted Mathlib docs instead, and no download of their data); its
      # per-module data (`:docInfo`) is cached with the doc-gen4 packages, and a partial restore
      # redoes only the modules whose `.olean` changed (measured for a full extraction: 15 min on
      # 12 cores, at most ~1.9 GB per process, 4 processes in parallel on this runner).
      - name: Restore API documentation data
        if: github.event_name != 'pull_request'
        uses: actions/cache@v6
        with:
          path: |
            docbuild/.lake
            .lake/packages/doc-gen4
            .lake/packages/leansqlite
            .lake/packages/UnicodeBasic
            .lake/packages/BibtexQuery
            .lake/packages/MD4Lean
          key: docs-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'docbuild/lake-manifest.json') }}
          restore-keys: docs-

      - name: Build the API documentation
        if: github.event_name != 'pull_request'
        working-directory: docbuild
        run: ~/.elan/bin/lake build TemporalGraph:docs

      - name: Assemble the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site
          cp .github/pages/index.html _site/
          cp -r docbuild/.lake/build/doc _site/docs
          cp -r blueprint/_out/site/html-multi _site/blueprint

      - name: Upload the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Required by deploy-pages (the previous runs failed with "Missing environment").
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
