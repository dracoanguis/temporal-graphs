name: Lean Action CI

# Palomar submission branch: builds the library, `Challenge` and `Solution` with the Mathlib cache.
# The blueprint and the API documentation are built and deployed from `main` only.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
