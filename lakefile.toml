name = "temporal-graph"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["TemporalGraph"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
weak.linter.style.emptyline=false

[[require]]
name = "mathlib"
scope = "leanprover-community"

[[require]]
name = "paranoia"
git = "https://github.com/oOo0oOo/LeanParanoia"
rev = "main"

[[lean_lib]]
name = "TemporalGraph"
