# formalization.yaml v0.4
version: "v0.4"

project:
  name: "Temporal cliques admit linear spanners"
  description: >-
    Lean 4 / Mathlib formalization of the theorem that every temporal clique on n vertices admits
    a temporal spanner with at most 7n edges. A temporal clique is the complete graph on a finite
    vertex set whose edges carry natural-number time labels, locally injective (two edges sharing
    an endpoint have distinct labels); a temporal spanner is a set of edges in which every vertex
    reaches every other one by a journey with non-decreasing labels. The result and its proof are
    due to Júlia Baligács (arXiv:2606.05156, 2026): the dismountability of Carnevale, Casteigts and
    Corsini (SAND 2025) reduces cliques to extremally matched bi-cliques, which are then covered by
    simple and extended stars. The compared statements give the explicit bound 7n and the
    asymptotic O(n) form with a bound function chosen uniformly for all cliques. They use the same
    definitions as the registered O(n log n) entry of the same repository. The work is supervised
    by Arnaud Casteigts and Karine Altisen.
  authors:
    - "Ethan Bargaud-Arm"
  responsible_maintainers:
    - "Ethan Bargaud-Arm"
  license: "Apache-2.0"

classification:
  arxiv: ["cs.DM", "math.CO"]
  msc2020: ["05C85", "05C40", "05C38", "68R10"]

